[package]
name = "emu-core"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["lib", "staticlib"]

[features]
std = ["thiserror/std", "derive_more/std"]

[dependencies]
bitfields = "1.0"
bytemuck = { version = "1.23", features = [ "derive" ] }
derive_more = { version = "2", default-features = false, features = ["into"] }
paste = "1.0"
thiserror = { version = "2.0", default-features = false }
