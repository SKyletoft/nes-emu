[package]
name = "breakout"
version = "0.1.0"
edition = "2024"

[dependencies]
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs" }
citro2d = { path = "../citro3d-rs/citro2d" }
citro3d = { path = "../citro3d-rs/citro3d" }
